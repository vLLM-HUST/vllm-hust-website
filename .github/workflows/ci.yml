name: ci

on:
  push:
    branches: [main, main-dev]
  pull_request:
    branches: [main, main-dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run pre-commit on committed website files
        run: pre-commit run --all-files
        env:
          SKIP: ${{ github.ref == 'refs/heads/main' && 'no-commit-to-branch' || '' }}
      - name: Verify benchmark publication and policy are merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_sources.py --benchmark-only
      - name: Checkout pinned benchmark data for this presentation
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: 28ff71ad071885bdd8b0e5375c06d19c52b15d40 # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false
      - name: Project and verify the committed benchmark publication
        run: |
          python .benchmark-source/scripts/sync_website_publication.py publish \
            --revision 28ff71ad071885bdd8b0e5375c06d19c52b15d40 --website .
          python .benchmark-source/scripts/sync_website_publication.py check \
            --revision 28ff71ad071885bdd8b0e5375c06d19c52b15d40 --website .
      - name: Assemble pinned benchmark navigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/assemble_dataset_entrypoints.py
      - name: Run unit tests
        run: |
          python scripts/update_benchmark_publication.py --check
          python -m pytest tests/ -v
      - name: Run JS data and Frontier tests
        run: >-
          node --test tests/current_compute_reference.test.cjs tests/controlplane.test.cjs tests/controller_discovery.test.cjs tests/loader_publication_identity.test.cjs tests/snapshot_status.test.cjs
          tests/b1_definition.test.cjs tests/optimization_exploration.test.cjs
          tests/mmlu_pro_handoff.test.cjs tests/frontierscience_handoff.test.cjs tests/hle_verified_handoff.test.cjs
          tests/serving_plan.test.mjs tests/leaderboard_frontier_model.test.cjs tests/leaderboard_910c_native.test.cjs tests/leaderboard_tiering_evidence.test.cjs tests/leaderboard_mooncake_evidence.test.cjs tests/plugin_performance.test.cjs
      - name: Validate engine_version vs. git_commit consistency
        run: python scripts/check_engine_version_consistency.py
      - name: Verify repository hook templates
        run: |
          test -f hooks/pre-commit
          test -f hooks/pre-push
          bash -n hooks/pre-commit
          bash -n hooks/pre-push
          grep -q 'ln -sf "../../hooks/pre-commit"' quickstart.sh
          grep -q 'ln -sf "../../hooks/pre-push"' quickstart.sh
      - name: Checkout merged public visibility policy
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: 28ff71ad071885bdd8b0e5375c06d19c52b15d40 # pragma: allowlist secret
          path: .publication-policy
          persist-credentials: false
          sparse-checkout: scripts/build_public_site.py
          sparse-checkout-cone-mode: false
      - name: Build and validate public visibility projection
        run: |
          python .publication-policy/scripts/build_public_site.py \
            --website . --output "$RUNNER_TEMP/public-site" \
            --policy-revision 28ff71ad071885bdd8b0e5375c06d19c52b15d40

  browser:
    runs-on: ubuntu-latest
    # Include browser installation, expanded product regressions and link audit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify benchmark publication and policy are merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_sources.py --benchmark-only
      - name: Checkout pinned benchmark data for this presentation
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: 28ff71ad071885bdd8b0e5375c06d19c52b15d40 # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false
      - name: Project and verify the committed benchmark publication
        run: |
          python .benchmark-source/scripts/sync_website_publication.py publish \
            --revision 28ff71ad071885bdd8b0e5375c06d19c52b15d40 --website .
          python .benchmark-source/scripts/sync_website_publication.py check \
            --revision 28ff71ad071885bdd8b0e5375c06d19c52b15d40 --website .
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Assemble pinned benchmark navigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/assemble_dataset_entrypoints.py
      - name: Verify rendered desktop and mobile pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m http.server 8769 --bind 127.0.0.1 > /tmp/website-browser-server.log 2>&1 &
          website_server_pid=$!
          trap 'kill "$website_server_pid"' EXIT
          python scripts/verify_dataset_matrix_browser.py --url http://127.0.0.1:8769
          python scripts/verify_dataset_entrypoints_browser.py --url http://127.0.0.1:8769
          python scripts/verify_dataset_standard_browser.py http://127.0.0.1:8769/dataset-standard.html --output output/dataset-standard
          python scripts/verify_b1_definition_browser.py --url http://127.0.0.1:8769 --output output/playwright/b1-definition
          python scripts/verify_formal_baseline_browser.py --url http://127.0.0.1:8769 --output output/playwright/formal-baseline-isolation
          python scripts/verify_baseline_version_browser.py --base-url http://127.0.0.1:8769
          python scripts/verify_five_dataset_comparison_browser.py --url http://127.0.0.1:8769 --output output/playwright/five-dataset-comparison
          python scripts/verify_controlplane_browser.py --url http://127.0.0.1:8769 --output output/playwright/controlplane
          python scripts/verify_optimization_exploration_browser.py --url http://127.0.0.1:8769 --output output/playwright/optimization-exploration
          python scripts/verify_capacity_layout_browser.py --url http://127.0.0.1:8769 --output output/playwright/capacity-layout
          python scripts/verify_report_history_browser.py --url http://127.0.0.1:8769 --output output/playwright/report-history
          python scripts/verify_capability_coverage_browser.py --url http://127.0.0.1:8769
          python scripts/verify_product_homepages_browser.py --url http://127.0.0.1:8769 --output output/product-homepages
          python scripts/verify_site_browser.py --url http://127.0.0.1:8769
          python scripts/verify_clarity_browser.py --url http://127.0.0.1:8769
          python scripts/verify_public_pages_browser.py --url http://127.0.0.1:8769
          python scripts/verify_incubation_delisting.py --url http://127.0.0.1:8769
          python scripts/verify_performance_navigation.py
          python scripts/verify_acceptance_completion_browser.py --url http://127.0.0.1:8769
          python scripts/verify_evidence_links_browser.py --url http://127.0.0.1:8769
          python scripts/audit_evidence_links_browser.py --url http://127.0.0.1:8769 --output output/playwright/all-page-links --verify-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-evidence
          path: |
            output/product-homepages/
            output/playwright/dataset-matrix/
            output/playwright/dataset-entrypoints/
            output/playwright/b1-definition/
            output/playwright/five-dataset-comparison/
            output/playwright/formal-baseline-isolation/
            output/playwright/baseline-version/
            output/playwright/optimization-exploration/
            output/playwright/capacity-layout/
            output/playwright/report-history/
            output/playwright/site-repair/
            output/playwright/clarity/
            output/playwright/public-pages/
            output/playwright/incubation-delisting/
            output/playwright/performance-navigation/
            output/playwright/evidence-links/
            output/playwright/all-page-links/
