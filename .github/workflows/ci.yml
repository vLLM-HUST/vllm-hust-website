name: ci

on:
  push:
    branches: [main, main-dev]
  pull_request:
    branches: [main, main-dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Checkout pinned benchmark data for this presentation
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: c12c35f9069a8f2663f290ae39c8a559b4e7c065 # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false
      - name: Project and verify the committed benchmark publication
        run: |
          python .benchmark-source/scripts/sync_website_publication.py publish \
            --revision c12c35f9069a8f2663f290ae39c8a559b4e7c065 --website .
          python .benchmark-source/scripts/sync_website_publication.py check \
            --revision c12c35f9069a8f2663f290ae39c8a559b4e7c065 --website .
      - name: Run pre-commit
        run: pre-commit run --all-files
        env:
          SKIP: ${{ github.ref == 'refs/heads/main' && 'no-commit-to-branch' || '' }}
      - name: Run unit tests
        run: python -m pytest tests/ -v
      - name: Run JS data and Frontier tests
        run: >-
          node --test tests/loader_publication_identity.test.cjs tests/snapshot_status.test.cjs
          tests/b1_definition.test.cjs
          tests/mmlu_pro_handoff.test.cjs tests/frontierscience_handoff.test.cjs tests/hle_verified_handoff.test.cjs
          tests/serving_plan.test.mjs tests/leaderboard_frontier_model.test.cjs tests/leaderboard_910c_native.test.cjs tests/leaderboard_tiering_evidence.test.cjs tests/leaderboard_mooncake_evidence.test.cjs tests/plugin_performance.test.cjs
      - name: Validate engine_version vs. git_commit consistency
        run: python scripts/check_engine_version_consistency.py
      - name: Verify repository hook templates
        run: |
          test -f hooks/pre-commit
          test -f hooks/pre-push
          bash -n hooks/pre-commit
          bash -n hooks/pre-push
          grep -q 'ln -sf "../../hooks/pre-commit"' quickstart.sh
          grep -q 'ln -sf "../../hooks/pre-push"' quickstart.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout pinned benchmark data for this presentation
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: c12c35f9069a8f2663f290ae39c8a559b4e7c065 # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false
      - name: Project and verify the committed benchmark publication
        run: |
          python .benchmark-source/scripts/sync_website_publication.py publish \
            --revision c12c35f9069a8f2663f290ae39c8a559b4e7c065 --website .
          python .benchmark-source/scripts/sync_website_publication.py check \
            --revision c12c35f9069a8f2663f290ae39c8a559b4e7c065 --website .
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify rendered desktop and mobile pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m http.server 8769 --bind 127.0.0.1 > /tmp/website-browser-server.log 2>&1 &
          website_server_pid=$!
          trap 'kill "$website_server_pid"' EXIT
          python scripts/verify_dataset_matrix_browser.py --url http://127.0.0.1:8769
          python scripts/verify_b1_definition_browser.py --url http://127.0.0.1:8769 --output output/playwright/b1-definition
          python scripts/verify_capability_coverage_browser.py --url http://127.0.0.1:8769
          python scripts/verify_site_browser.py --url http://127.0.0.1:8769
          python scripts/verify_betterscale_browser.py --url http://127.0.0.1:8769
          python scripts/verify_traceloom_browser.py --url http://127.0.0.1:8769
          python scripts/verify_incubation_delisting.py --url http://127.0.0.1:8769
          python scripts/verify_performance_navigation.py
          python scripts/verify_evidence_links_browser.py --url http://127.0.0.1:8769
          python scripts/audit_evidence_links_browser.py --url http://127.0.0.1:8769 --output output/playwright/all-page-links --verify-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-evidence
          path: |
            output/playwright/dataset-matrix/
            output/playwright/b1-definition/
            output/playwright/site-repair/
            output/playwright/betterscale/
            output/playwright/traceloom/
            output/playwright/incubation-delisting/
            output/playwright/performance-navigation/
            output/playwright/evidence-links/
            output/playwright/all-page-links/

  betterscale-package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble and inspect the public ARM package on CPU (no native loading)
        run: |
          python -m pip wheel --no-deps vllm-betterscale==0.5.1 --wheel-dir /tmp/betterscale-wheels
          python -m pip install --no-deps --target /tmp/betterscale-package --platform linux_aarch64 --only-binary=:all: /tmp/betterscale-wheels/*.whl
          echo "PYTHONPATH=/tmp/betterscale-package" >> "$GITHUB_ENV"
      - name: Verify wheel and displayed TP8 / DP8 launch contracts (CPU only)
        run: python scripts/check_betterscale_install.py --output betterscale-launch-commands.json
      - uses: actions/upload-artifact@v4
        with:
          name: betterscale-checked-launch-commands
          path: betterscale-launch-commands.json
