name: ci

on:
  push:
    branches: [main, main-dev]
  pull_request:
    branches: [main, main-dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run pre-commit
        run: pre-commit run --all-files
        env:
          SKIP: ${{ github.ref == 'refs/heads/main' && 'no-commit-to-branch' || '' }}
      - name: Run unit tests
        run: pytest tests/ -v
      - name: Run JS loader unit tests
        run: node --test tests/loader_publication_identity.test.cjs tests/snapshot_status.test.cjs
      - name: Validate engine_version vs. git_commit consistency
        run: python scripts/check_engine_version_consistency.py
      - name: Verify repository hook templates
        run: |
          test -f hooks/pre-commit
          test -f hooks/pre-push
          bash -n hooks/pre-commit
          bash -n hooks/pre-push
          grep -q 'ln -sf "../../hooks/pre-commit"' quickstart.sh
          grep -q 'ln -sf "../../hooks/pre-push"' quickstart.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify rendered desktop and mobile pages
        run: |
          python -m http.server 8769 --bind 127.0.0.1 > /tmp/website-browser-server.log 2>&1 &
          website_server_pid=$!
          trap 'kill "$website_server_pid"' EXIT
          python scripts/verify_site_browser.py --url http://127.0.0.1:8769
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-evidence
          path: output/playwright/site-repair/
