name: leaderboard-runs-review

on:
  push:
    branches: [main, codex/unified-leaderboard]
    paths:
      - 'leaderboard-runs.html'
      - 'assets/leaderboard-runs*'
      - 'assets/leaderboard-frontier*'
      - 'data/leaderboard_*.json'
      - 'scripts/*leaderboard_run*'
      - 'scripts/*leaderboard_frontier*'
      - 'tests/*leaderboard_run*'
      - 'tests/*leaderboard_frontier*'
      - 'tests/fixtures/leaderboard_frontier.json'
      - '.github/workflows/leaderboard-runs.yml'
  pull_request:
    paths:
      - 'leaderboard-runs.html'
      - 'assets/leaderboard-runs*'
      - 'assets/leaderboard-frontier*'
      - 'data/leaderboard_*.json'
      - 'scripts/*leaderboard_run*'
      - 'scripts/*leaderboard_frontier*'
      - 'tests/*leaderboard_run*'
      - 'tests/*leaderboard_frontier*'
      - 'tests/fixtures/leaderboard_frontier.json'
      - '.github/workflows/leaderboard-runs.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout canonical benchmark publication
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: d3b2549827fdf1120d760fad0790088cd7c9b482 # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and verify canonical benchmark data
        run: |
          python .benchmark-source/scripts/sync_website_publication.py publish \
            --revision d3b2549827fdf1120d760fad0790088cd7c9b482 --website .
          python .benchmark-source/scripts/sync_website_publication.py check \
            --revision d3b2549827fdf1120d760fad0790088cd7c9b482 --website .
      - run: node --test tests/leaderboard_runs_model.test.cjs tests/leaderboard_frontier_model.test.cjs
      - name: Install review dependencies and run Python tests
        timeout-minutes: 15
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
          pytest tests/test_leaderboard_run_observations.py -q
      - name: Check real evidence and responsive interactions
        timeout-minutes: 8
        run: |
          python -m http.server 8774 --bind 127.0.0.1 > /tmp/leaderboard-runs-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/verify_leaderboard_runs_browser.py
          python scripts/verify_leaderboard_frontier_browser.py
          python scripts/verify_leaderboard_contract_browser.py
          FRONTIER_QA_URL=http://127.0.0.1:8774 python scripts/verify_leaderboard_frontier_native27_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaderboard-runs-review
          path: |
            output/playwright/leaderboard-runs/
            output/playwright/leaderboard-contract/
