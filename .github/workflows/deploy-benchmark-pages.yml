name: Deploy Pages From Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [benchmark-publication]

permissions:
  contents: read

concurrency:
  group: benchmark-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website presentation
        uses: actions/checkout@v4
        with:
          ref: main
          path: website
          persist-credentials: false
      - name: Checkout merged benchmark publication
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: c7e0ad58ec9f5793f91509a8783e26ccbe1a04fe # pragma: allowlist secret
          path: benchmark
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate committed benchmark data and source manifest
        run: |
          benchmark_commit=$(git -C benchmark rev-parse HEAD)
          python benchmark/scripts/sync_website_publication.py publish \
            --revision "$benchmark_commit" --website website
          python benchmark/scripts/sync_website_publication.py check \
            --revision "$benchmark_commit" --website website
      - name: Validate publication and presentation
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: website
        run: |
          python scripts/assemble_dataset_entrypoints.py
          python -m pip install pytest
          python -m pytest -q tests/test_benchmark_publication.py
          python -m pytest -q tests/test_dataset_entrypoints.py
          node --test tests/loader_publication_identity.test.cjs tests/b1_definition.test.cjs tests/mmlu_pro_handoff.test.cjs tests/dataset_validation_b0.test.cjs
      - name: Checkout merged public visibility policy
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: 391f237f54fed9a68e66430e72d31f5d2c000877 # pragma: allowlist secret
          path: publication-policy
          persist-credentials: false
          sparse-checkout: scripts/build_public_site.py
          sparse-checkout-cone-mode: false
      - name: Build and validate public visibility projection
        run: |
          python publication-policy/scripts/build_public_site.py \
            --website website --output public-site \
            --policy-revision 391f237f54fed9a68e66430e72d31f5d2c000877
      - name: Upload assembled site without committing generated data
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
