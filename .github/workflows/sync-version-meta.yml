name: Sync Version Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: reviewed-version-readme
  cancel-in-progress: false

jobs:
  sync-version-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout reviewed version metadata
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: dc7b2a9b70175a1def11c870070de5feadde6b9e # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: website-publication/data/version_meta.json
          sparse-checkout-cone-mode: false
      - name: Render README from the reviewed metadata
        run: >-
          python scripts/sync_version_meta.py --readme-only
          --metadata .benchmark-source/website-publication/data/version_meta.json
      - name: Validate README references
        run: bash scripts/check_stale_versions.sh
      - name: Save README candidate
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-version-readme
          path: README.md
          retention-days: 7
      - name: Open or update the README PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: automation/reviewed-version-readme
          base: main
          add-paths: README.md
          commit-message: 'docs: render reviewed runtime metadata'
          title: 'docs: render reviewed runtime metadata'
          body: |
            Render the README from the pinned benchmark publication metadata.
            Website data remains generated by the production publication workflow.
