name: Prepare Benchmark Data Artifact

on:
  repository_dispatch:
    types: [leaderboard-update]
  workflow_dispatch:
  schedule:
    # Run every 6 hours to catch any missed updates
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Checkout benchmark repo (snapshots only)
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          path: _benchmark
          sparse-checkout: |
            leaderboard-data/snapshots
            leaderboard-data/dataset-validation
            leaderboard-data/official-targets.json
            leaderboard-data/official-targets.sha256
            docs/official-baselines
            schemas
            scripts/validate_public_leaderboard_snapshots.py
            src/vllm_hust_benchmark
          sparse-checkout-cone-mode: false

      - name: Record benchmark source
        id: benchmark-source
        run: echo "commit=$(git -C _benchmark rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate benchmark snapshots before website sync
        run: |
          python _benchmark/scripts/validate_public_leaderboard_snapshots.py \
            --snapshot-dir _benchmark/leaderboard-data/snapshots
          PYTHONPATH=_benchmark/src python -m vllm_hust_benchmark.dataset_validation \
            --root _benchmark/leaderboard-data/dataset-validation

      - name: Prepare admitted sync evidence
        run: |
          python scripts/prepare_leaderboard_sync.py \
            --source-dir _benchmark/leaderboard-data/snapshots \
            --target-dir data \
            --registry _benchmark/leaderboard-data/official-targets.json \
            --registry-checksum _benchmark/leaderboard-data/official-targets.sha256 \
            --benchmark-commit "${{ steps.benchmark-source.outputs.commit }}" \
            --pr-body /tmp/leaderboard-sync-pr-body.md

      - name: Sync snapshot files to website data/
        run: |
          python scripts/refresh_leadership_target_pin.py \
            --pin data/leadership_performance_targets.json \
            --registry _benchmark/leaderboard-data/official-targets.json \
            --registry-checksum _benchmark/leaderboard-data/official-targets.sha256 \
            --current-registry data/official_targets.json \
            --current-registry-checksum data/official_targets.sha256
          python scripts/sync_leaderboard_snapshots.py \
            --source-dir _benchmark/leaderboard-data/snapshots \
            --target-dir data
          python scripts/sync_dataset_validation_snapshots.py \
            --source-dir _benchmark/leaderboard-data/dataset-validation \
            --target-dir data

      - name: Save benchmark-derived preview artifact (never a website data PR)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-data-preview-${{ steps.benchmark-source.outputs.commit }}
          path: |
            data/
            /tmp/leaderboard-sync-pr-body.md
          retention-days: 7
          if-no-files-found: error
