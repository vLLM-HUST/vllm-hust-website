name: Sync Plugin Workshop Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-plugin-workshop-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout canonical publication data
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: c17289b58c0e3d93033d8426d8d8b55ce17fc253 # pragma: allowlist secret
          path: .benchmark-source
          persist-credentials: false
          sparse-checkout: |
            website-publication
            scripts/sync_website_publication.py
          sparse-checkout-cone-mode: false

      - name: Project canonical publication data
        run: >-
          python .benchmark-source/scripts/sync_website_publication.py publish
          --revision c17289b58c0e3d93033d8426d8d8b55ce17fc253 --website .

      - name: Sync Workshop metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_plugin_workshop_metadata.py

      - name: Validate generated Workshop metadata
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest \
            tests/test_sync_plugin_workshop_metadata.py \
            tests/test_plugins_page.py -q

      # Publication data changes belong in benchmark; do not push stale copies to main.
      - name: Save candidate metadata for benchmark publication
        uses: actions/upload-artifact@v4
        with:
          name: plugin-workshop-metadata-candidate
          path: data/plugin-workshop-metadata.json
          retention-days: 7
