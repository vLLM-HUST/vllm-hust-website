name: Sync Plugin Workshop Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: write

jobs:
  sync-plugin-workshop-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Workshop metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_plugin_workshop_metadata.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/plugin-workshop-metadata.json; then
            echo "No Workshop metadata updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugin-workshop-metadata.json
          git commit -m "chore: sync plugin workshop metadata"
          git push
