default_language_version:
  python: python3

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    # Preserve byte-identical measured Prometheus responses.
    exclude: ^reports/frontier-managed-(tiering|mooncake)-20260926/.*\.prom$
  - id: end-of-file-fixer
    exclude: ^reports/frontier-managed-(tiering|mooncake)-20260926/.*\.prom$
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: check-toml
  - id: check-added-large-files
    args: ["--maxkb=1000"]
    exclude: ^reports/frontier-managed-(tiering|mooncake)-20260926/(native|tiering|mooncake)-c16-requests\.jsonl\.gz$
  - id: check-added-large-files
    name: check bounded C16 raw request artifacts
    # Complete measured streams, gzip-compressed and SHA256-checked by CI.
    args: ["--maxkb=2048"]
    files: ^reports/frontier-managed-(tiering|mooncake)-20260926/(native|tiering|mooncake)-c16-requests\.jsonl\.gz$
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: ^reports/frontier-managed-(tiering|mooncake)-20260926/.*\.prom$
  - id: detect-private-key
  - id: no-commit-to-branch
    name: block commits to main
    args: [--branch, main]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff
    name: ruff check
    args: [--fix]
  - id: ruff-format
    name: ruff format

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2, --preserve-quotes]
    exclude: ^\.github/

- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm
    args: [--wrap=100]
    # SKILL.md has YAML frontmatter; plain mdformat does not preserve it.
    exclude: (^CHANGELOG\.md$|(^|/)SKILL\.md$)

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    # Evidence snapshots carry public Git IDs and verified model/workload/script/request SHA256 values.
    exclude: ^(reports/frontier-managed-(tiering|mooncake)-20260926/((native|tiering|mooncake)-qualification|latency-audit)\.json$|docs/evidence/qwen35-bidkv-tp4-20260929/qwen35-manifest\.json$|docs/evidence/qwen35-mods-k8s-20260925/(model-manifest|workload-equivalence)\.json$|docs/evidence/kv-materialization-qwen35-20260928/summary\.json$|\.env\.template|tests/fixtures/|data/examples/.*\.json|data/dataset_validation_(v1\.b0|qwen35_(bidkv|tp2_matrix|tp2_ep_ctx32k_apcoff_inf_out256|frontier_unified_900s))\.json|data/leaderboard_.*\.json|data/stateaxis-.*\.json|data/plugin-performance\.json|data/leadership_performance_targets\.json|data/official_targets\.json|data/changzheng_release\.json|data/betterscale-(results|qwen-swe|qwen-steps|qwen-mc2|qwen-mtp-async|dsv4-steps)\.json|data/backups/|reports/prefix_repetition_wrong_gpu_mem_removed_20260726\.json)$

- repo: local
  hooks:
  - id: forbid-mock
    name: forbid mock usage
    entry: bash -c 'if grep -nE "\\bmock\\b|mock_|_mock|--mock" "$@"; then echo "Mock usage is forbidden. Use CPU backend for validation."; exit 1; fi'
    language: system
    types: [text]
    pass_filenames: true
    # Frontier is measured evidence; its full upstream file manifest includes unused source filenames.
    exclude: ^(data/leaderboard_frontier\.json$|\.pre-commit-config\.yaml|pyproject\.toml|\.mypy_cache/|\.ruff_cache/|\.pytest_cache/|docs/|\.github/workflows/|CHANGELOG\.md)
